services:
  qdrant:
    image: qdrant/qdrant:v1.19.1   # pinned: keep in step with qdrant-client in requirements.txt
    ports:
      - "6333:6333"   # REST API + web dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped
